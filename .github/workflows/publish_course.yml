name: Build and Publish Course
on:
  push:
    branches: [main]
    # Only rebuild when sources change. Without this filter the workflow
    # retriggers on its own "Rebuild course materials" commit and on
    # GitBook's sync commits, ping-ponging indefinitely (both only touch
    # course/ and assets/ outputs).
    paths:
      - "src/**"
      - "scripts/**"
      - "web/**"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install image tooling
        run: |
          pip install pillow
          sudo apt-get update && sudo apt-get install -y pngquant

      - name: Build the web course files
        run: python scripts/publish.py

      - name: Extract solutions for appendix
        run: python scripts/extract_solutions.py

      - name: Extract key terms for appendix
        run: python scripts/extract_key_terms.py

      - name: Prepare markdown for PDF
        run: python scripts/prepare_pdf.py

      # WeasyPrint lays out the PDF (page numbers, TOC page references,
      # bookmark outline); KaTeX pre-renders the math server-side via node,
      # which is preinstalled on ubuntu-latest runners.
      - name: Install PDF tooling
        run: |
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
          pip install weasyprint markdown-it-py mdit-py-plugins linkify-it-py pygments
          npm install --no-save katex

      - name: Generate PDF from processed markdown
        run: python scripts/build_pdf.py

      - name: Clean up intermediate files
        run: rm -f course/Redstone-University.md

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f course/ assets/
          # The PDF embeds a fresh timestamp and document ID on every run, so it
          # differs byte-for-byte even when the content is identical. If it is
          # the ONLY staged change, that's metadata noise — discard it so we
          # don't churn a ~19 MB LFS object (and used to feed a commit loop).
          if [ -z "$(git diff --staged --name-only | grep -v '^course/Redstone-University.pdf$')" ]; then
            echo "Only the PDF changed (metadata noise); discarding it."
            git restore --staged --worktree course/Redstone-University.pdf 2>/dev/null \
              || { git reset -q HEAD course/Redstone-University.pdf; git checkout -- course/Redstone-University.pdf; }
          fi
          git status
          if ! git diff --staged --quiet; then
            git commit -m "docs: Rebuild course materials and PDF"
            git pull --rebase
            git push
          else
            echo "No changes to commit."
          fi
